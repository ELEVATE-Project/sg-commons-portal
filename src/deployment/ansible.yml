
    # 9. Install npm dependencies with cache recovery

    - name: Verify npm cache
      ansible.builtin.command:
        argv:
          - "{{ node_bin_dir }}/npm"
          - cache
          - verify
      environment:
        PATH: "{{ node_bin_dir }}:{{ ansible_env.PATH }}"
      changed_when: false

    - name: Install npm dependencies with retry on failure
      ansible.builtin.shell: |
        set -uo pipefail

        echo "Attempting npm install..."

        if npm install --force; then
          echo "npm install completed successfully."
          exit 0
        fi

        echo "First npm install failed. Cleaning npm cache..."

        npm cache clean --force

        echo "Retrying npm install..."

        npm install --force

        echo "npm dependencies installed successfully."
      args:
        chdir: "{{ project_path }}"
        executable: /bin/bash
      environment:
        PATH: "{{ node_bin_dir }}:{{ ansible_env.PATH }}"
      register: npm_install_result
